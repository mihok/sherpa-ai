name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  core:
    name: Analyze + pure-Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: tools/test_all.sh --dart

  flutter-tests:
    name: Widget + golden tests (Linux only)
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Every Flutter package and the app. The on-device engine's
      # integration tests skip here: no engine library or model on runners.
      - name: flutter test (packages + app)
        run: tools/test_all.sh --flutter
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: '**/test/**/failures/'

  android:
    name: Android debug build + 16 KB alignment gate
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: 16 KB page alignment
        run: |
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$zipalign" -c -P 16 -v 4 app/build/app/outputs/flutter-apk/app-debug.apk | tail -3

  ios:
    name: iOS build (no codesign)
    needs: core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build iOS
        working-directory: app
        run: flutter build ios --debug --no-codesign

  evals:
    name: Evals (L0, L1, L3, L4 scripted) + gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Fails on any gate: absolute bounds, failing cases outside the
      # documented known issues, and regressions against
      # packages/sherpa_evals/baselines/*.scripted.json.
      - name: Run suites and gate
        working-directory: packages/sherpa_evals
        run: dart run sherpa_evals:eval --suite L0,L1,L3,L4 --model scripted --out build/evals
      - name: Job summary
        if: always()
        run: cat packages/sherpa_evals/build/evals/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: packages/sherpa_evals/build/evals/

  perf:
    name: Host benchmarks + perf gate (linux-ci)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Median of 5 samples per scenario; the engine scenario skips here
      # (no engine library or model on runners; its baseline is optional).
      - name: Host benchmarks
        working-directory: packages/sherpa_evals
        run: dart run sherpa_evals:bench --samples 5 --out ../../build/bench
      - name: Perf gate
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'perf-rebaseline') }}
        run: >-
          dart run tools/perf_gate.dart --results build/bench --baselines bench/baselines/linux-ci
          --summary "$GITHUB_STEP_SUMMARY" --json build/perf-gate.json
      # With the perf-rebaseline label the gate only reports, and the new
      # baselines are uploaded for review; a human commits them. (Adding
      # the label does not start a run: re-run this job or push.)
      - name: Rebaseline (perf-rebaseline label)
        if: ${{ contains(github.event.pull_request.labels.*.name, 'perf-rebaseline') }}
        run: |
          dart run tools/perf_gate.dart --results build/bench --baselines bench/baselines/linux-ci --summary "$GITHUB_STEP_SUMMARY" || true
          dart run tools/perf_gate.dart --rebaseline --results build/bench --baselines bench/baselines/linux-ci --out build/new-baselines/linux-ci
          echo "New linux-ci baselines are in the perf-baselines artifact: review them, copy to bench/baselines/linux-ci/ and commit." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            build/bench/
            build/perf-gate.json
      - if: ${{ contains(github.event.pull_request.labels.*.name, 'perf-rebaseline') }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-baselines
          path: build/new-baselines/

  # Opt-in: runs on pull requests labelled `frame-bench` (re-run the job
  # after adding the label). Emulator frames are CPU-rendered (SwiftShader),
  # so this is a relative, catastrophic-regression check only (R12 §3.4,
  # §3.8), and it never blocks a merge. Budget: a cold profile build for
  # x86_64, one emulator boot and one launch with 3 repetitions of the five
  # scenarios; about 15 minutes (estimated, not yet run on GitHub).
  # bench/app/README.md has the details and the device instructions.
  frame-bench:
    name: Frame timing on the Android emulator (optional, frame-bench label)
    if: ${{ contains(github.event.pull_request.labels.*.name, 'frame-bench') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Gates against bench/baselines/android-emulator-api36-swiftshader/;
      # while that class holds placeholders it writes measured baselines to
      # build/new-baselines/ instead (uploaded below for review).
      - name: Frame bench (emulator, 3 repetitions)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # Perf runs need real animation durations (R12 §3.4).
          disable-animations: false
          script: bash bench/app/run_frame_bench.sh -d emulator-5554 -c android-emulator-api36-swiftshader -n 1 -r 3 -o build/bench-emulator -b build/new-baselines/android-emulator-api36-swiftshader
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frame-bench
          path: |
            build/bench-emulator/*.json
            build/bench-emulator/runs/
            build/new-baselines/

  webview-security:
    name: MCP Apps shell security suite (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # Same Playwright as the suite was written against; its Chromium
      # goes to the default cache, not /opt/pw-browsers.
      - run: npm install -g playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Sandbox, CSP and bridge checks
        run: PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" packages/sherpa_webview/test/web/run.sh
