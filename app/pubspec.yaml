name: sherpa
description: Sherpa — local-first mobile agent harness.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  cupertino_http: ^3.1.0
  cupertino_ui: ^1.1.3
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  http: ^1.6.0
  material_ui: ^1.7.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sherpa_core: any
  sherpa_data: any
  sherpa_markdown: any
  sherpa_net: any
  sherpa_providers: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
